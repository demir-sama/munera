<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:"InterV";src:url("Inter.ttf");font-weight:100 900}
:root{--blue:#12378F;--tint:#E8EEFA;--black:#0A0A0A;--off:#F7F8FA;--gray:#4A505C}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1500px;height:500px;overflow:hidden;font-family:"InterV","Inter",sans-serif;color:var(--black);-webkit-font-smoothing:antialiased}
#b{position:relative;width:1500px;height:500px;overflow:hidden;background:linear-gradient(100deg,#fff 0%,#fff 35%,#F7F8FA 100%)}
#hex{position:absolute;inset:0;-webkit-mask-image:linear-gradient(90deg,rgba(0,0,0,.7),#000 40%)}
.abs{position:absolute}
.eyebrow{left:620px;top:148px;font-size:19px;font-weight:600;letter-spacing:.005em;color:var(--gray);white-space:nowrap}
.h1{left:616px;top:180px;font-weight:800;font-size:64px;line-height:66px;letter-spacing:-0.035em;white-space:nowrap}
.line{left:622px;top:334px;width:96px;height:4px;border-radius:2px;background:var(--blue)}
.chip{left:1236px;top:356px;height:36px;padding:0 16px 0 12px;border-radius:18px;background:#fff;border:1.5px solid #DCE4F5;display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;color:var(--blue);letter-spacing:-.005em;box-shadow:0 2px 8px rgba(18,55,143,.08)}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--blue)}
.card{background:#fff;border-radius:18px;box-shadow:0 1px 2px rgba(10,10,10,.05),0 12px 28px rgba(10,10,10,.08),0 26px 56px rgba(18,55,143,.09);border:1px solid #EEF1F7}
</style></head><body><div id="b">
<svg width="0" height="0" style="position:absolute"><defs>
 <symbol id="logo" viewBox="449 413 1070 1192"><g fill="#0A0A0A">
   <polygon points="970,423 459,720 459,1268 554,1210 554,793 970,549"/>
   <polygon points="998,423 1509,720 1509,1268 1414,1210 1414,793 998,549"/>
   <polygon points="463,1300 969,1595 969,1472 567,1239"/>
   <polygon points="1505,1300 999,1595 999,1472 1401,1239"/>
   <polygon points="741,985 984,1133 1227,985 1227,1154 984,1300 741,1154"/></g>
  <polygon fill="#12378F" points="984,762 754,902 984,1040 1214,902"/></symbol></defs></svg>
<div id="hex"></div>
<svg class="abs" style="left:388px;top:150px" width="180" height="200"><use href="#logo"/></svg>
<div class="abs eyebrow">Solana-native escrow for content bounties</div>
<div class="abs h1">Enter the arena.<br>Earn your reward.</div>
<div class="abs line"></div>

<!-- vault card -->
<div class="abs card" style="left:1196px;top:118px;width:224px;height:122px;padding:16px 18px">
  <div style="display:flex;align-items:center;gap:10px">
    <div style="width:30px;height:30px;border-radius:9px;background:var(--tint);display:flex;align-items:center;justify-content:center">
      <svg width="16" height="17" viewBox="0 0 56 60" fill="none"><rect x="6" y="26" width="44" height="30" rx="9" fill="#12378F"/><path d="M15 26v-8a13 13 0 0 1 26 0v8" stroke="#12378F" stroke-width="6" stroke-linecap="round"/></svg></div>
    <div style="font-size:13px;font-weight:700;letter-spacing:-.01em">Bounty vault</div>
    <div style="margin-left:auto;font-size:11px;font-weight:600;color:var(--blue);background:var(--tint);padding:3px 8px;border-radius:8px">Funded</div>
  </div>
  <div style="margin-top:14px;display:flex;align-items:baseline;gap:6px"><span style="font-size:26px;font-weight:800;letter-spacing:-.03em">2,500</span><span style="font-size:13px;font-weight:600;color:var(--gray)">USDC</span></div>
  <div style="margin-top:10px;height:8px;border-radius:4px;background:var(--tint)"><div style="width:68%;height:100%;border-radius:4px;background:var(--blue)"></div></div>
</div>
<!-- paid chip -->
<div class="abs card" style="left:1262px;top:268px;width:178px;height:56px;border-radius:28px;display:flex;align-items:center;padding-left:10px;gap:10px">
  <div style="width:36px;height:36px;border-radius:50%;background:var(--tint);display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 22 22" fill="none"><path d="M4 11.5 L9 16.5 L18 6" stroke="#12378F" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  <div><div style="font-size:14px;font-weight:700;letter-spacing:-.01em;line-height:17px">Paid</div><div style="font-size:11px;font-weight:500;color:var(--gray);line-height:14px">On approval</div></div>
</div>
<div class="abs chip"><i></i>munera-opal.vercel.app</div>
</div>
<script>
function hexSVG(w,h,s){const W=Math.sqrt(3)*s,H=1.5*s;let d='';
 for(let r=-1;r<h/H+1;r++)for(let c=-1;c<w/W+1;c++){const cx=c*W+(r%2?W/2:0),cy=r*H;
  const p=[0,1,2,3,4,5].map(i=>{const a=Math.PI/180*(60*i-30);return[cx+s*Math.cos(a),cy+s*Math.sin(a)]});
  d+='M'+p.map(q=>q[0].toFixed(1)+' '+q[1].toFixed(1)).join('L')+'Z';}
 return `<svg width="${w}" height="${h}"><path d="${d}" fill="none" stroke="#12378F" stroke-opacity="0.06" stroke-width="1.2"/></svg>`}
document.getElementById('hex').innerHTML=hexSVG(1500,500,34);
window.ready=document.fonts.ready;
</script></body></html>
